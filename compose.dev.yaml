name: lmao-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      # The whole project, including ./data (dev run history and connection).
      - .:/app
    depends_on:
      # The first stylesheet exists before the page is served.
      css:
        condition: service_healthy

  css:
    build:
      context: .
      dockerfile: Dockerfile
      target: css-deps
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - HOME=/tmp
    volumes:
      # Live sources for the class scan and the compiler; the output lands in
      # ./static (css, js, vendor, fonts).
      - ./static:/build/static
      - ./templates:/build/templates:ro
      - ./frontend:/build/frontend:ro
      - ./types:/build/types:ro
      - ./tsconfig.json:/build/tsconfig.json:ro
      - ./scripts/build-assets.sh:/build/scripts/build-assets.sh:ro
    # One build first, so the healthcheck passes as soon as the files exist.
    # tsc watches in the background; Tailwind stays in the foreground.
    # --watch=always: Tailwind v4 stops watching when stdin closes, and it does
    # in a container without a terminal.
    command:
      - sh
      - -c
      - >-
        sh scripts/build-assets.sh node_modules static &&
        ./node_modules/.bin/tsc --project tsconfig.json &&
        ./node_modules/.bin/tailwindcss -i static/css/input.css -o static/css/app.css &&
        { ./node_modules/.bin/tsc --project tsconfig.json --watch --preserveWatchOutput & } &&
        exec ./node_modules/.bin/tailwindcss -i static/css/input.css -o static/css/app.css --watch=always
    healthcheck:
      test: ["CMD-SHELL", "test -s static/css/app.css && test -s static/js/lmao.js && test -s static/vendor/alpine.min.js && test -s static/fonts/inter-latin-300.woff2"]
      interval: 2s
      timeout: 2s
      retries: 30