services:
  app:
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    restart: unless-stopped
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  # Shared by dev and prod and owned by the user, not by Compose:
  # `docker compose down -v` never removes it. `make dev|prod` creates it if missing.
  ollama_data:
    external: true
    name: ollama