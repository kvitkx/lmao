name: Auto bump

# Opens the patch release PR when main carries only commits that are safe to
# release automatically: fix, ci and docs (any scope), chore(deps) and
# chore(ci), nothing else. feat, a `!` suffix and every other type keep the
# release a human decision. The guards and the weekly schedule are documented
# in docs/MAINTENANCE.md. Run it by hand with `dry-run` to see the decision
# without opening a pull request.
#
# The PR is created with MAINTENANCE_TOKEN: created with GITHUB_TOKEN, the
# pull request would never run its required checks (events from GITHUB_TOKEN
# start no workflows). Without the secret the run goes red. Merging the PR
# stays manual: it is the release button.

on:
  schedule:
    # Mondays 12:00 UTC: after the runtime group PR (09:00) and its CI.
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Decide and log, but open no pull request.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: auto-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Open the release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full clone so the commit classification sees all tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker
        if: ${{ !inputs.dry-run }}
        uses: ./.github/actions/setup-docker # zizmor: ignore[self-repository]

      - name: Open the release PR
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_TOKEN || github.token }}
          DRY_RUN: ${{ inputs.dry-run && '1' || '' }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: scripts/ci/auto-bump.sh

  alert:
    name: Maintenance alert
    # A red run usually means that MAINTENANCE_TOKEN expired. One issue for the
    # whole workflow: a failed run opens or updates it, the first green run
    # closes it (scripts/ci/maintenance-alert.sh). Main only.
    needs: bump
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open, update or close the alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_TITLE: Auto bump failed
          ALERT_JOBS: bump=${{ needs.bump.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/ci/maintenance-alert.sh
