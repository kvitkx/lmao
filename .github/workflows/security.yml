name: Security

# Daily checks that do not depend on a code change: new advisories appear
# for pinned dependencies, actions and the published image.
# Same as `GH_TOKEN="$(gh auth token)" make security`.
#
# Not run on pull requests: the result reflects the published image and
# today's advisories, not the change under review. To test a change to this
# workflow or its scripts: `make security`, then
# `gh workflow run security.yml --ref <branch>`.
#
# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity (Dependabot merges do not count). If that
# happens, re-enable the workflow in the Actions tab.

on:
  schedule:
    - cron: "00 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

env:
  CI_DEV_IMAGE: lmao:dev-ci-${{ github.sha }}

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: ./.github/actions/setup-docker # zizmor: ignore[self-repository]

      - name: make report-audit
        run: make report-audit

  scan-published:
    name: Scan published image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Trivy cache
        uses: ./.github/actions/setup-trivy-cache # zizmor: ignore[self-repository]

      - name: make report-scan-published
        env:
          SARIF_FILE: reports/trivy-latest.sarif
        run: make report-scan-published

      - name: Upload SARIF to Code scanning
        if: ${{ !cancelled() && hashFiles('reports/trivy-latest.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: reports/trivy-latest.sarif
          category: trivy-published-image

  zizmor:
    name: Audit workflows (online)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: make report-zizmor-sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SARIF_FILE: reports/zizmor.sarif
        run: make report-zizmor-sarif

      - name: Upload SARIF to Code scanning
        if: ${{ !cancelled() && hashFiles('reports/zizmor.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: reports/zizmor.sarif
          category: zizmor