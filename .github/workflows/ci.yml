name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-image:
        description: Skip the image build and scan; the caller builds and verifies it.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_DEV_IMAGE: lmao:dev-ci-${{ github.sha }}
  CI_IMAGE: lmao:ci-${{ github.sha }}

jobs:
  check-workflows:
    name: Check workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: make report-check-workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make report-check-workflows

  check-code:
    name: Check code
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: ./.github/actions/setup-docker # zizmor: ignore[self-repository]

      - name: make report-check-code
        run: make report-check-code

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: ignore

  check-image:
    name: Check image
    # inputs is empty outside workflow_call, so this is true on PRs.
    if: ${{ !inputs.skip-image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: ./.github/actions/setup-docker # zizmor: ignore[self-repository]

      - name: Set up Trivy cache
        uses: ./.github/actions/setup-trivy-cache # zizmor: ignore[self-repository]

      - name: make report-check-image
        run: make report-check-image