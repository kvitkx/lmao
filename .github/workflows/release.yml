name: Release

# Every push to main builds and verifies the production image once.
# If pyproject.toml carries a version without a tag yet, that same image
# (same digest) is copied to GHCR and Docker Hub, its provenance attested
# in the GitHub Attestations API, and the GitHub Release creates the tag.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  STAGING_IMAGE: localhost:5000/lmao
  CI_IMAGE: lmao:release-scan

jobs:
  ci:
    name: CI gate
    # The image is built and verified once, in the publish job.
    # Temporary, targeted exception for the existing tooling issue.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      skip-image: true
    permissions:
      contents: read

  publish:
    name: Build, Verify & Publish
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full clone so plan.sh sees existing tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Plan release
        id: plan
        run: scripts/release/plan.sh

      - name: Compute image names
        id: image
        env:
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          re='^[a-z0-9_.-]+/[a-z0-9_.-]+$'
          if [[ ! "${DOCKERHUB_REPOSITORY}" =~ ${re} ]]; then
            echo "::error::Repository variable DOCKERHUB_REPOSITORY must be namespace/name."
            exit 1
          fi
          {
            echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}"
            echo "dockerhub=docker.io/${DOCKERHUB_REPOSITORY}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker
        uses: ./.github/actions/setup-docker # zizmor: ignore[self-repository]
        with:
          # Lets BuildKit push to the staging registry on the runner.
          driver-opts: network=host

      - name: Start staging registry
        run: |
          docker run -d --name staging-registry -p 127.0.0.1:5000:5000 "$(make -s print-REGISTRY_IMAGE)"
          for _ in {1..30}; do
            curl -fsS http://localhost:5000/v2/ >/dev/null && exit 0
            sleep 1
          done
          echo "::error::Staging registry did not start."
          exit 1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ steps.image.outputs.name }}
            ${{ steps.image.outputs.dockerhub }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.plan.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.plan.outputs.tag }},enable=${{ !contains(steps.plan.outputs.tag, '-') }}
            type=semver,pattern={{major}},value=${{ steps.plan.outputs.tag }},enable=${{ !contains(steps.plan.outputs.tag, '-') && !startsWith(steps.plan.outputs.tag, 'v0.') }}

      # Built once. Everything below tests and publishes this digest.
      - name: Build candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          pull: true
          push: true
          tags: ${{ env.STAGING_IMAGE }}:candidate
          labels: ${{ steps.meta.outputs.labels }}
          # Plain image manifest, no BuildKit attestation referrers in the
          # registry: provenance lives in the GitHub Attestations API only
          # (see the attest step below). Explicit false because BuildKit
          # attaches mode=min provenance by default on push.
          provenance: false
          sbom: false
          cache-from: type=gha,version=2,scope=lmao-production
          cache-to: type=gha,version=2,scope=lmao-production,mode=max,ignore-error=true

      - name: Pull candidate by immutable digest
        env:
          IMAGE_REF: ${{ env.STAGING_IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "${IMAGE_REF}"
          docker tag "${IMAGE_REF}" "${CI_IMAGE}"

      - name: Set up Trivy cache
        uses: ./.github/actions/setup-trivy-cache # zizmor: ignore[self-repository]

      # Same target as in CI and locally. It never builds.
      - name: make report-test-image
        run: make report-test-image

      - name: Log in to GHCR
        if: steps.plan.outputs.release == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.plan.outputs.release == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote verified image to release tags
        if: steps.plan.outputs.release == 'true'
        env:
          IMAGE_SOURCE: ${{ env.STAGING_IMAGE }}@${{ steps.build.outputs.digest }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: scripts/release/promote.sh

      - name: Attest build provenance
        if: steps.plan.outputs.release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          # push-to-registry stays false (the default): the attestation is
          # stored in the GitHub Attestations API only, verifiable with
          # gh attestation verify, and GHCR keeps no referrer manifests.

      - name: Attest build provenance (Docker Hub)
        if: steps.plan.outputs.release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ vars.DOCKERHUB_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          # push-to-registry stays false, same as for GHCR.

      - name: Write summary
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
          TAG: ${{ steps.plan.outputs.tag }}
          IMAGE_REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          DOCKERHUB_REF: ${{ steps.image.outputs.dockerhub }}@${{ steps.build.outputs.digest }}
        run: |
          {
            if [[ "${RELEASE}" == true ]]; then
              echo "### Published ${TAG}"
              echo
              echo "\`${IMAGE_REF}\`"
              echo
              echo "\`${DOCKERHUB_REF}\`"
            else
              echo "### No release"
              echo
              echo "Tag ${TAG} already exists. The image was built and verified only."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  # Last step: creating the release creates the tag.
  # A tag therefore means the whole release finished.
  github-release:
    name: GitHub Release
    needs: publish
    if: needs.publish.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: scripts/release/create-github-release.sh